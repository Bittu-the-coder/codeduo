version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: codeduo-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: codeduo
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - codeduo-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: codeduo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - codeduo-network

  # Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codeduo-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://admin:password@mongodb:27017/codeduo?authSource=admin
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
      FRONTEND_URLS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-this-refresh-in-production}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      BACKEND_URL: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - redis
    networks:
      - codeduo-network

volumes:
  mongodb_data:
  redis_data:

networks:
  codeduo-network:
    driver: bridge
